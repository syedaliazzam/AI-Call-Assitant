# File: apps/desktop/electron-builder.yml
# Purpose: How the Windows installer is built (Day 6 Stage 3): electron-builder, NSIS, per-user
#          (no admin rights), "Paramount AI" by "Paramount Intelligence", the company icons, and a
#          clean uninstall that asks whether to keep the user's local data.
# Used by: the "dist:win" script in apps/desktop/package.json
# Architecture: docs/architecture/kite-architecture-v3.1.md §10 (installation); ADR-0028;
#               docs/design/paramount-ai-ui-spec.md §2 (the rename is display strings only)
# Never changes: Windows and the updater know the installed app by it.
appId: co.paramountintelligence.kite
# The name people see. The data folder stays %APPDATA%\Kite: src/main.ts pins it, because Electron
# would otherwise move it to this name and the app would lose every session and setting.
productName: Paramount AI
copyright: Copyright © 2026 Paramount Intelligence
directories:
  # Icons and the NSIS include live in build/; installers are written to release/ (git-ignored).
  buildResources: build
  output: release
# Only the bundled main and preload (esbuild puts @kite/shared inside them) and package.json.
files:
  - dist/**
  - package.json
# The accurate-transcription engine's native runtime (v1.0.1, ADR-0034), staged by
# scripts/stage-native.mjs. Outside the app archive, because native code cannot load from it.
# The accurate model itself (661 MB) is not shipped: it downloads only when the user turns it on.
extraResources:
  - from: native/sherpa-onnx
    to: sherpa-onnx
  # v1.3.1 (ADR-0059): the streaming speech model (about 204 MB) and its SHA-256 manifest, staged by
  # scripts/stage-stt-model.mjs. src/speechModel.ts answers the web app's model addresses from it, so a
  # fresh install connects without a download. The files never change between releases, so differential
  # updates reuse them (checked at each release from the installers' block maps).
  - from: native/stt-model
    to: stt-model
  # 1.7.2 (ADR-0106): the tray icon (src/tray.ts trayIconFile): the .ico on Windows, the PNG on macOS.
  # The app archive's own build/ folder is not shipped, so the tray reads them from resources/tray.
  - from: build/icon.ico
    to: tray/icon.ico
  - from: build/icon.png
    to: tray/icon.png
extraMetadata:
  # The installed folder (%LOCALAPPDATA%Programskite) comes from the package name; the
  # workspace name "@kite/desktop" would give "@kitedesktop".
  name: kite
  # Packaged apps start from the bundled main process.
  main: dist/main.js
# The app needs no native Node modules, so nothing is rebuilt for Electron.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  # The publisher Windows shows comes from package.json "author" (Paramount Intelligence).
nsis:
  # One-click, per-user install into %LOCALAPPDATA%\Programs\Kite: no admin prompt.
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  # 1.7.4: a Desktop icon too. Without one, people re-ran the Setup .exe from Downloads to open the app,
  # which reinstalled it every time. build/installer.nsh recreates it if it was deleted.
  createDesktopShortcut: true
  shortcutName: Paramount AI
  uninstallDisplayName: Paramount AI
  # No spaces: GitHub renames them in release assets, and latest.yml must match the asset's name.
  artifactName: Paramount-AI-Setup-${version}.exe
  # The "keep my local data?" question at uninstall (build/installer.nsh, which deletes %APPDATA%\Kite).
  include: build/installer.nsh
# Where installed apps look for updates (ADR-0028): the public releases-only repository. Only
# installers, latest.yml and blockmaps are published there (with gh, by the developer); the app
# needs no token. Move to a company organisation is a decision for the lead.
# macOS's list of links this app opens; Windows registers it in build/installer.nsh and src/main.ts.
protocols:
  - name: Paramount AI
    schemes:
      - paramountai
publish:
  provider: github
  owner: Zainpak123
  repo: kite-releases
  releaseType: release

# macOS (Day 6 Stage 6, readiness only: no Mac to test on). Unsigned until the lead decides on an
# Apple Developer account; testers open it with Privacy & Security → Open Anyway
# (docs/testing/macos-checklist.md).
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # Placeholder: scaled up from the 304 px logo until the designer's vector arrives (Day 6 list).
  icon: build/icon-1024.png
  category: public.app-category.business
  # Unsigned build: no signing identity is looked for.
  identity: null
  # Ready for signing later: the hardened runtime needs these entitlements (build/entitlements.mac.plist).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # The text macOS shows when Kite asks for the microphone.
    NSMicrophoneUsageDescription: Paramount AI listens to your side of the call to write the live transcript. The audio stays on this Mac.
    # The text macOS shows when Kite asks to record the other side of the call (system audio).
    NSAudioCaptureUsageDescription: Paramount AI records the other side of the call (system audio) to write the live transcript. The audio stays on this Mac.
dmg:
  artifactName: Paramount-AI-${version}-${arch}.dmg

# Microsoft Store package (MSIX/AppX), POST-V1 (developer decision, 2 Nov): kept, not used for v1.
# Investigated 2 Nov as the no-purchase alternative to code
# signing: the Store signs the package with Microsoft's certificate, which Smart App Control
# trusts). Build with "pnpm dist:store". The identity values below are placeholders until
# Partner Center reserves the name: copy Package/Identity/Name, Package/Identity/Publisher and
# the publisher display name from Product management → Product identity
# (docs/deploy/microsoft-store.md).
appx:
  identityName: ParamountIntelligence.Kite
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisherDisplayName: Paramount Intelligence
  applicationId: Kite
  displayName: Paramount AI
  backgroundColor: '#0B1630'
  languages:
    - en-US
  # runFullTrust: a desktop (Win32) app; microphone: lists Kite in Windows' microphone privacy
  # settings; internetClient: Kite opens the deployed web app.
  capabilities:
    - runFullTrust
    - internetClient
    - microphone
  # The Store updates the app; the app's own updater is off in Store builds (src/main.ts).
  electronUpdaterAware: false
  artifactName: Paramount-AI-${version}.${ext}
