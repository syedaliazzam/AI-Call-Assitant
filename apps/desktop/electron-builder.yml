# File: apps/desktop/electron-builder.yml
# Purpose: How the desktop app is built. Windows (Day 6 Stage 3): electron-builder, NSIS, per-user
#          (no admin rights), "Paramount AI" by "Paramount Intelligence", the company icons, and a
#          clean uninstall that asks whether to keep the user's local data. macOS (1.8.0, ADR-0109): one
#          universal app signed with the company's self-signed certificate, as a .zip (installer and
#          updater) and a .dmg (fallback), updated from its own channel (mac-latest).
# Used by: the "dist:win" and "dist:mac" scripts in apps/desktop/package.json; scripts/mac/build.sh;
#          electron-builder.mac-developer-id.yml (extends this file)
# Architecture: docs/architecture/kite-architecture-v3.1.md §10 (installation); ADR-0028; ADR-0109;
#               docs/design/paramount-ai-ui-spec.md §2 (the rename is display strings only)
# Never changes: Windows and the updater know the installed app by it.
appId: co.paramountintelligence.kite
# The name people see. The data folder stays %APPDATA%\Kite: src/main.ts pins it, because Electron
# would otherwise move it to this name and the app would lose every session and setting.
productName: Paramount AI
copyright: Copyright © 2026 Paramount Intelligence
directories:
  # Icons and the NSIS include live in build/; installers are written to release/ (git-ignored).
  buildResources: build
  output: release
# Only the bundled main and preload (esbuild puts @kite/shared inside them) and package.json.
files:
  - dist/**
  - package.json
# The accurate-transcription engine's native runtime (v1.0.1, ADR-0034), staged by
# scripts/stage-native.mjs. Outside the app archive, because native code cannot load from it.
# The accurate model itself (661 MB) is not shipped: it downloads only when the user turns it on.
extraResources:
  - from: native/sherpa-onnx
    to: sherpa-onnx
  # v1.3.1 (ADR-0059): the streaming speech model (about 204 MB) and its SHA-256 manifest, staged by
  # scripts/stage-stt-model.mjs. src/speechModel.ts answers the web app's model addresses from it, so a
  # fresh install connects without a download. The files never change between releases, so differential
  # updates reuse them (checked at each release from the installers' block maps).
  - from: native/stt-model
    to: stt-model
  # 1.7.2 (ADR-0106): the tray icon (src/tray.ts trayIconFile): the .ico on Windows, the PNG on macOS.
  # The app archive's own build/ folder is not shipped, so the tray reads them from resources/tray.
  - from: build/icon.ico
    to: tray/icon.ico
  - from: build/icon.png
    to: tray/icon.png
extraMetadata:
  # The installed folder (%LOCALAPPDATA%Programskite) comes from the package name; the
  # workspace name "@kite/desktop" would give "@kitedesktop".
  name: kite
  # Packaged apps start from the bundled main process.
  main: dist/main.js
# The app needs no native Node modules, so nothing is rebuilt for Electron.
npmRebuild: false
win:
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
  # The publisher Windows shows comes from package.json "author" (Paramount Intelligence).
nsis:
  # One-click, per-user install into %LOCALAPPDATA%\Programs\Kite: no admin prompt.
  oneClick: true
  perMachine: false
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Paramount AI
  uninstallDisplayName: Paramount AI
  # No spaces: GitHub renames them in release assets, and latest.yml must match the asset's name.
  artifactName: Paramount-AI-Setup-${version}.exe
  # The "keep my local data?" question at uninstall (build/installer.nsh, which deletes %APPDATA%\Kite).
  include: build/installer.nsh
# Where installed apps look for updates (ADR-0028): the public releases-only repository. Only
# installers, latest.yml and blockmaps are published there (with gh, by the developer); the app
# needs no token. Move to a company organisation is a decision for the lead.
# macOS's list of links this app opens; Windows registers it in build/installer.nsh and src/main.ts.
protocols:
  - name: Paramount AI
    schemes:
      - paramountai
publish:
  provider: github
  owner: Zainpak123
  repo: kite-releases
  releaseType: release

# macOS (1.8.0, ADR-0109): an internal release, built on a teammate's Mac with scripts/mac/build.sh
# (docs/deploy/mac-signing-certificate.md, docs/testing/mac-release-test.md). Not released until the
# real-Mac test passes.
mac:
  # One universal app (Apple chip and Intel). The zip is what the updater and install-mac.sh use; the dmg
  # is the manual fallback.
  target:
    - target: zip
      arch: universal
    - target: dmg
      arch: universal
  # No spaces (GitHub renames them in release assets, and latest-mac.yml must match): the zip's name.
  artifactName: Paramount-AI-${version}-${arch}-mac.${ext}
  # Placeholder: scaled up from the 304 px logo until the designer's vector arrives (Day 6 list).
  icon: build/icon-1024.png
  category: public.app-category.business
  # The company's self-signed certificate (ADR-0109). electron-builder finds it by this name in the keychain
  # build.sh names (CSC_KEYCHAIN), where it is trusted for code signing. One certificate for every build keeps
  # the app's signing rule the same, so macOS keeps its permissions and Squirrel.Mac accepts its updates.
  identity: Paramount Intelligence Internal Code Signing
  # A Mac build fails rather than come out unsigned (an unsigned build would lose every Mac's permissions).
  forceCodeSigning: true
  # Off with a self-signed certificate: the hardened runtime turns on library validation, which can refuse
  # Electron's own frameworks without an Apple team (electron-builder 26.17.0 docs). Notarization needs it,
  # so electron-builder.mac-developer-id.yml turns it on with the entitlements below.
  hardenedRuntime: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Both Mac speech engines are in both halves of the universal app (scripts/stage-native.mjs --mac-universal),
  # and each is built for one CPU, so the universal merge leaves them as they are; the engine loads the one
  # for the Mac's CPU.
  x64ArchFiles: '**/sherpa-onnx-darwin-*/**'
  # ADR-0109: the Mac app's own update channel, one fixed release tag whose files each Mac release replaces
  # (scripts/mac/publish-mac.mjs). Windows keeps reading the newest release (publish above), so Windows-only
  # releases never leave Macs without an update file.
  publish:
    provider: generic
    url: https://github.com/Zainpak123/kite-releases/releases/download/mac-latest
    # GitHub's file servers are not known to answer several byte ranges in one request.
    useMultipleRangeRequest: false
  extendInfo:
    # The text macOS shows when Paramount AI asks for the microphone. ADR-0101: the audio goes to the
    # transcription service during the call (cloud transcription), so it does not say "stays on this Mac".
    NSMicrophoneUsageDescription: Paramount AI listens to your side of the call to write the live transcript. The audio is never stored.
    # The text macOS shows when Paramount AI asks to record the other side of the call (system audio).
    NSAudioCaptureUsageDescription: Paramount AI listens to the other side of the call (your computer's sound) to write the live transcript. The audio is never stored.
    # Meeting recordings are saved in Documents/Paramount AI/Recordings (ADR-0068); macOS asks once.
    NSDocumentsFolderUsageDescription: Paramount AI saves the meetings you record in Documents › Paramount AI › Recordings.
dmg:
  artifactName: Paramount-AI-${version}-${arch}.${ext}

# Microsoft Store package (MSIX/AppX), POST-V1 (developer decision, 2 Nov): kept, not used for v1.
# Investigated 2 Nov as the no-purchase alternative to code
# signing: the Store signs the package with Microsoft's certificate, which Smart App Control
# trusts). Build with "pnpm dist:store". The identity values below are placeholders until
# Partner Center reserves the name: copy Package/Identity/Name, Package/Identity/Publisher and
# the publisher display name from Product management → Product identity
# (docs/deploy/microsoft-store.md).
appx:
  identityName: ParamountIntelligence.Kite
  publisher: CN=00000000-0000-0000-0000-000000000000
  publisherDisplayName: Paramount Intelligence
  applicationId: Kite
  displayName: Paramount AI
  backgroundColor: '#0B1630'
  languages:
    - en-US
  # runFullTrust: a desktop (Win32) app; microphone: lists Kite in Windows' microphone privacy
  # settings; internetClient: Kite opens the deployed web app.
  capabilities:
    - runFullTrust
    - internetClient
    - microphone
  # The Store updates the app; the app's own updater is off in Store builds (src/main.ts).
  electronUpdaterAware: false
  artifactName: Paramount-AI-${version}.${ext}
